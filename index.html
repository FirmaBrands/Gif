:root{--bg:#f4f3ef;--ink:#131313;--mute:#7a7872;--line:#dcdad3;--panel:#fff;--acc:#ff5a1f;--ok:#1f8a4c;--bad:#c8321e;
 --font:'Polin',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#121211;--ink:#f1f0ec;--mute:#8d8b84;--line:#2c2b28;--panel:#1a1a18}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:56px 20px 96px}
h1{font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:0 0 36px}
.sub{color:var(--mute);font-weight:300;font-size:17px;margin:0 0 36px}
.lbl{font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.lbl em{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none}
section{padding:26px 0;border-top:1px solid var(--line)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* drop */
#drop{display:block;border:1.5px dashed var(--line);border-radius:18px;padding:52px 20px;text-align:center;cursor:pointer;transition:.15s;background:transparent}
#drop:hover,#drop.over{border-color:var(--ink);background:var(--panel)}
#drop b{display:block;font-weight:700;font-size:20px;margin-bottom:4px}
#drop span{color:var(--mute);font-weight:300}
#drop u{text-decoration-thickness:1px;text-underline-offset:3px}
#file{display:none}
#clip{display:none}
#clip video{width:100%;max-height:300px;border-radius:14px;background:#000;display:block}
.fileRow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:12px}
.fileRow b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileRow small{color:var(--mute);font-weight:300;white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--mute);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link:hover{color:var(--ink)}
.dim{opacity:.4;pointer-events:none}

/* size */
.sizeRow{display:flex;gap:10px;align-items:stretch}
.num{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;font-size:28px;letter-spacing:-.01em;width:100%}
.num::placeholder{color:var(--ink);opacity:.9}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:0 16px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 13px;font-size:14px;color:var(--mute)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* order */
#order{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
#order li{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px}
#order li+li{border-top:1px solid var(--line)}
#order .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
#order .t{flex:1;min-width:0}
#order .t b{font-weight:600;display:block;line-height:1.2}
#order .rg{display:flex;gap:14px;margin-top:4px;flex-wrap:wrap}
#order .rg label{font-size:13px;color:var(--mute);font-weight:300;display:flex;align-items:center;gap:6px}
#order .rg select{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
#order .rg select:disabled{opacity:.6}
.mv{display:flex;gap:4px}
.mv button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:none;display:grid;place-items:center;color:var(--mute)}
.mv button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.mv button:disabled{opacity:.25;cursor:default}
.hint{color:var(--mute);font-weight:300;font-size:14px;margin:10px 0 0}

/* trim + toggles */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:block}
.fld span{display:block;font-size:13px;color:var(--mute);font-weight:300;margin-bottom:4px}
.fld input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0;cursor:pointer}
.tg small{display:block;color:var(--mute);font-weight:300;font-size:13px}
.tg input{display:none}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.15s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.tg input:checked+.sw{background:var(--ink)}
.tg input:checked+.sw:after{left:21px}
.tg input:focus-visible+.sw{outline:2px solid var(--acc);outline-offset:2px}

/* action */
.go{width:100%;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:18px;padding:17px;transition:.15s}
.go:hover:not(:disabled){transform:translateY(-1px)}
.go:disabled{opacity:.3;cursor:default}
#prog{display:none}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:9px;transition:width .2s}
.pt{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--mute);font-weight:300;font-size:14px}
.pt b{color:var(--ink);font-weight:600}
#err{display:none;color:var(--bad);margin:14px 0 0;font-weight:500}

/* result */
#res{display:none}
#res .pv{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;place-items:center}
#res img{max-width:100%;max-height:420px;border-radius:8px;display:block}
.big{display:flex;align-items:baseline;gap:10px;margin:20px 0 10px}
.big b{font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1}
.big span{color:var(--mute);font-weight:300}
.fit{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.fit i{display:block;height:100%;background:var(--ok)}
.fit.over i{background:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 20px}
.facts div{border-top:1px solid var(--line);padding-top:8px}
.facts small{display:block;color:var(--mute);font-weight:300;font-size:12px}
.facts b{font-weight:600;font-size:15px}
.warn{background:var(--panel);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:500;display:none}
.row{display:flex;gap:10px}
.row .go{flex:1}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);width:auto;padding:17px 22px}
.note{color:var(--mute);font-weight:300;font-size:13px;margin:12px 0 0}
#vid{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
@media(max-width:420px){.facts{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}}

.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .im{flex:1;min-width:0}
.item b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mute);font-weight:300;font-size:13px}
.item .st{font-weight:600;font-size:14px;white-space:nowrap}
.item .st.w{color:var(--acc)}.item .st.f{color:var(--bad)}
.x{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mute);font-size:18px;line-height:1;flex:none}
.x:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}.x:disabled{opacity:.25;cursor:default}
#list{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:2px 16px}
#listwrap{display:none}
.cardName{font-weight:600;margin:0 0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card+.card{margin-top:36px;padding-top:30px;border-top:1px solid var(--line)}
.card .go{width:100%}
#allrow{display:none;margin-top:30px}
</style>
</head>

<main>
<h1>Video to GIF</h1>

<section style="border-top:0;padding-top:0">
 <label id="drop" for="file"><b>Drop videos here</b><span>or <u>browse</u></span></label>
 <input id="file" type="file" accept="video/mp4,video/*" multiple>
 <div id="listwrap">
  <div id="list"></div>
  <div class="fileRow"><span></span><button class="link" id="more" type="button">Add more</button></div>
 </div>

  <div class="seg" role="group" aria-label="Unit"><button type="button" data-u="KB" aria-pressed="false">KB</button><button type="button" data-u="MB" aria-pressed="true">MB</button></div>
 </div>

</section>

 </div>
</section>
</div>

</section>
</main>

function axis(sn,dn){const sc=sn/dn,st=new Int32Array(dn),off=new Int32Array(dn),cnt=new Int32Array(dn),ws=[];

  st[d]=i0;off[d]=ws.length;cnt[d]=i1-i0+1;
  for(let i=i0;i<=i1;i++){ws.push(Math.max(0,Math.min(i+1,s1)-Math.max(i,s0))/(s1-s0))}}
 return{st,off,cnt,w:Float32Array.from(ws)}}

function resize(src,sw,sh,dw,dh){
 const ax=axis(sw,dw),ay=axis(sh,dh),tmp=new Float32Array(dw*sh*3);
 for(let y=0;y<sh;y++){const row=y*sw*3;
  for(let dx=0;dx<dw;dx++){const a=ax.st[dx],o=ax.off[dx],c=ax.cnt[dx];let r=0,g=0,b=0;
   for(let k=0;k<c;k++){const wg=ax.w[o+k],p=row+(a+k)*3;r+=src[p]*wg;g+=src[p+1]*wg;b+=src[p+2]*wg}
   const t=(y*dw+dx)*3;tmp[t]=r;tmp[t+1]=g;tmp[t+2]=b}}
 const out=new Uint8Array(dw*dh*3);
 for(let dy=0;dy<dh;dy++){const a=ay.st[dy],o=ay.off[dy],c=ay.cnt[dy];
  for(let x=0;x<dw;x++){let r=0,g=0,b=0;
   for(let k=0;k<c;k++){const wg=ay.w[o+k],p=((a+k)*dw+x)*3;r+=tmp[p]*wg;g+=tmp[p+1]*wg;b+=tmp[p+2]*wg}
   const q=(dy*dw+x)*3;out[q]=r+0.5;out[q+1]=g+0.5;out[q+2]=b+0.5}}
 return out}

function getFrame(i,w,h){const s=F[i];return(w===BW&&h===BH)?s:resize(s,BW,BH,w,h)}

function buildPalette(cnt,sr,sg,sb,K){
 const ids=[];for(let i=0;i<32768;i++)if(cnt[i])ids.push(i);
 const nb=ids.length,R=new Float32Array(nb),G=new Float32Array(nb),B=new Float32Array(nb),C=new Float32Array(nb);
 for(let i=0;i<nb;i++){const id=ids[i],c=cnt[id];C[i]=c;R[i]=sr[id]/c;G[i]=sg[id]/c;B[i]=sb[id]/c}
 if(nb<=K){const p=new Uint8Array(nb*3);for(let i=0;i<nb;i++){p[i*3]=R[i]+.5;p[i*3+1]=G[i]+.5;p[i*3+2]=B[i]+.5}return p}
 const ord=new Int32Array(nb);for(let i=0;i<nb;i++)ord[i]=i;
 function mk(lo,hi){let c=0,r0=255,r1=0,g0=255,g1=0,b0=255,b1=0;
  for(let i=lo;i<hi;i++){const j=ord[i];c+=C[j];if(R[j]<r0)r0=R[j];if(R[j]>r1)r1=R[j];if(G[j]<g0)g0=G[j];if(G[j]>g1)g1=G[j];if(B[j]<b0)b0=B[j];if(B[j]>b1)b1=B[j]}
  return{lo,hi,cnt:c,rr:(r1-r0)*1.41,gg:(g1-g0)*2,bb:(b1-b0)*1.73}}
 const boxes=[mk(0,nb)];
 while(boxes.length<K){let bi=-1,bp=-1;
  for(let k=0;k<boxes.length;k++){const b=boxes[k];if(b.hi-b.lo<2)continue;const pr=Math.max(b.rr,b.gg,b.bb)*Math.sqrt(b.cnt);if(pr>bp){bp=pr;bi=k}}
  if(bi<0)break;
  const b=boxes[bi],ch=(b.rr>=b.gg&&b.rr>=b.bb)?R:(b.gg>=b.bb?G:B);
  ord.subarray(b.lo,b.hi).sort((x,y)=>ch[x]-ch[y]);
  const half=b.cnt/2;let acc=0,mid=b.lo+1;
  for(let i=b.lo;i<b.hi-1;i++){acc+=C[ord[i]];mid=i+1;if(acc>=half)break}
  boxes[bi]=mk(b.lo,mid);boxes.push(mk(mid,b.hi))}
 const K2=boxes.length,pal=new Float32Array(K2*3);
 for(let k=0;k<K2;k++){const b=boxes[k];let r=0,g=0,bl=0,c=0;
  for(let i=b.lo;i<b.hi;i++){const j=ord[i];r+=R[j]*C[j];g+=G[j]*C[j];bl+=B[j]*C[j];c+=C[j]}
  pal[k*3]=r/c;pal[k*3+1]=g/c;pal[k*3+2]=bl/c}
 const sum=new Float64Array(K2*3),wt=new Float64Array(K2);
 for(let it=0;it<4;it++){sum.fill(0);wt.fill(0);
  for(let i=0;i<nb;i++){let best=0,bd=1e18;const r=R[i],g=G[i],b=B[i];
   for(let k=0;k<K2;k++){const dr=r-pal[k*3],dg=g-pal[k*3+1],db=b-pal[k*3+2],d=2*dr*dr+4*dg*dg+3*db*db;if(d<bd){bd=d;best=k}}
   sum[best*3]+=r*C[i];sum[best*3+1]+=g*C[i];sum[best*3+2]+=b*C[i];wt[best]+=C[i]}
  for(let k=0;k<K2;k++)if(wt[k]>0){pal[k*3]=sum[k*3]/wt[k];pal[k*3+1]=sum[k*3+1]/wt[k];pal[k*3+2]=sum[k*3+2]/wt[k]}}
 const out=new Uint8Array(K2*3);for(let i=0;i<K2*3;i++)out[i]=pal[i]+.5;return out}

function lzw(pix,len,minCode,table,lz){
 const alpha=1<<minCode,clear=alpha,eoi=alpha+1,tl=4096*alpha;
 table.fill(0,0,tl);
 let next=eoi+1,size=minCode+1,cur=0,sh=0;
 const emit=c=>{cur|=c<<sh;sh+=size;while(sh>=8){lz.u8(cur&255);cur>>>=8;sh-=8}};
 emit(clear);
 let pre=pix[0];
 for(let i=1;i<len;i++){const k=pix[i],key=pre*alpha+k,c=table[key];
  if(c!==0){pre=c;continue}
  emit(pre);
  if(next===4096){emit(clear);table.fill(0,0,tl);next=eoi+1;size=minCode+1}
  else{if(next>=(1<<size))size++;table[key]=next++}
  pre=k}
 emit(pre);emit(eoi);if(sh>0)lz.u8(cur&255)}

function samplePalette(cnt,sr,sg,sb,K){
 const pal0=buildPalette(cnt,sr,sg,sb,K);return pal0}

function makeEncoder(w,h,cs,pal0,loop,dith){
 const nc=pal0.length/3,T=nc;
 let bits=1;while((1<<bits)<nc+1)bits++;
 const minCode=Math.max(2,bits),tsize=1<<bits,pal=new Uint8Array(tsize*3);pal.set(pal0);
 const cache=new Int16Array(262144).fill(-1);
 const lookup=key=>{const r=((key>>12)&63)*4+2,g=((key>>6)&63)*4+2,b=(key&63)*4+2;let best=0,bd=1e18;
  for(let k=0;k<nc;k++){const dr=r-pal[k*3],dg=g-pal[k*3+1],db=b-pal[k*3+2],d=2*dr*dr+4*dg*dg+3*db*db;if(d<bd){bd=d;best=k}}
  cache[key]=best;return best};
 const str=0.75,tol=4;
 const ref=new Uint8Array(w*h*3),disp=new Uint8Array(w*h).fill(T),idx=new Uint8Array(w*h),sub=new Uint8Array(w*h);
 let cur=new Float32Array((w+2)*3),nxt=new Float32Array((w+2)*3);
 const table=new Int32Array(4096*(1<<minCode)),lz=new Buf(1<<16),frames=[];
 let j=0;
 function add(fr){
  let x0=w,x1=-1,y0=h,y1=-1;
  if(dith){cur.fill(0);nxt.fill(0)}
  for(let y=0;y<h;y++){const dir=(y&1)?-1:1;let x=dir>0?0:w-1;
   for(let c=0;c<w;c++,x+=dir){const q=y*w+x,o=q*3;let r=fr[o],g=fr[o+1],b=fr[o+2];
    if(j>0){const a=r-ref[o],a2=g-ref[o+1],a3=b-ref[o+2];
     if(a<=tol&&a>=-tol&&a2<=tol&&a2>=-tol&&a3<=tol&&a3>=-tol){idx[q]=T;continue}}
    const ex=(x+1)*3;
    if(dith){r+=cur[ex]*str;g+=cur[ex+1]*str;b+=cur[ex+2]*str;r=r<0?0:r>255?255:r;g=g<0?0:g>255?255:g;b=b<0?0:b>255?255:b}
    const key=(((r|0)>>2)<<12)|(((g|0)>>2)<<6)|((b|0)>>2);let k=cache[key];if(k<0)k=lookup(key);
    if(dith){const er=r-pal[k*3],eg=g-pal[k*3+1],eb=b-pal[k*3+2];
     const fx=ex+dir*3,bx=ex-dir*3;
     cur[fx]+=er*.4375;cur[fx+1]+=eg*.4375;cur[fx+2]+=eb*.4375;
     nxt[bx]+=er*.1875;nxt[bx+1]+=eg*.1875;nxt[bx+2]+=eb*.1875;
     nxt[ex]+=er*.3125;nxt[ex+1]+=eg*.3125;nxt[ex+2]+=eb*.3125;
     nxt[fx]+=er*.0625;nxt[fx+1]+=eg*.0625;nxt[fx+2]+=eb*.0625}
    if(j>0&&k===disp[q]){idx[q]=T;continue}
    idx[q]=k;disp[q]=k;ref[o]=fr[o];ref[o+1]=fr[o+1];ref[o+2]=fr[o+2];
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
   if(dith){const t=cur;cur=nxt;nxt=t;nxt.fill(0)}}
  if(x1<0){
   if(frames.length){frames[frames.length-1].d+=cs}
   else{frames.push({x:0,y:0,w:1,h:1,d:cs,data:(()=>{lz.n=0;sub[0]=T;lzw(sub,1,minCode,table,lz);return lz.a.slice(0,lz.n)})()})}
  }else{
   const fw=x1-x0+1,fh=y1-y0+1;let pix;
   if(fw===w){pix=idx.subarray(y0*w,(y1+1)*w)}
   else{for(let y=0;y<fh;y++)sub.set(idx.subarray((y0+y)*w+x0,(y0+y)*w+x0+fw),y*fw);pix=sub}
   lz.n=0;lzw(pix,fw*fh,minCode,table,lz);
   frames.push({x:x0,y:y0,w:fw,h:fh,d:cs,data:lz.a.slice(0,lz.n)})}
  j++}
 function finish(){
  const out=new Buf(1<<18);
  for(const c of'GIF89a')out.u8(c.charCodeAt(0));
  out.u16(w);out.u16(h);out.u8(0x80|(7<<4)|(bits-1));out.u8(0);out.u8(0);out.put(pal);
  if(loop){out.u8(0x21);out.u8(0xFF);out.u8(11);for(const c of'NETSCAPE2.0')out.u8(c.charCodeAt(0));out.u8(3);out.u8(1);out.u16(0);out.u8(0)}
  for(const f of frames){
   out.u8(0x21);out.u8(0xF9);out.u8(4);out.u8(0x05);out.u16(Math.min(65535,f.d));out.u8(T);out.u8(0);
   out.u8(0x2C);out.u16(f.x);out.u16(f.y);out.u16(f.w);out.u16(f.h);out.u8(0);out.u8(minCode);
   for(let i=0;i<f.data.length;i+=255){const e=Math.min(f.data.length,i+255);out.u8(e-i);out.put(f.data,i,e)}
   out.u8(0)}
  out.u8(0x3B);
  return{bytes:out.a.slice(0,out.n),w,h,frames:frames.length,srcFrames:j,colors:nc,cs}}
 return{add,finish}}

function newHist(){return{cnt:new Uint32Array(32768),sr:new Float64Array(32768),sg:new Float64Array(32768),sb:new Float64Array(32768)}}
function accum(H,fr,w,h,stride){for(let q=0;q<w*h;q+=stride){const o=q*3,r=fr[o],g=fr[o+1],b=fr[o+2],key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);H.cnt[key]++;H.sr[key]+=r;H.sg[key]+=g;H.sb[key]+=b}}
const strideFor=(ns,w,h)=>Math.max(1,Math.floor(ns*w*h/400000))|1;

async function encode(p,prog){
 cancelled=false;lastY=performance.now();
 const cs=p.cs,w=Math.max(2,Math.round(BW*p.scale)),h=Math.max(2,Math.round(BH*p.scale));
 const m=Math.max(1,Math.round(N*BCS/cs)),map=j=>Math.min(N-1,Math.round(j*cs/BCS));
 const K=Math.max(2,Math.min(255,p.colors-1));
 const ns=Math.min(m,48),H=newHist(),stride=strideFor(ns,w,h);
 for(let s=0;s<ns;s++){const j=ns===1?0:Math.round(s*(m-1)/(ns-1));accum(H,getFrame(map(j),w,h),w,h,stride);await maybeYield()}
 const enc=makeEncoder(w,h,cs,buildPalette(H.cnt,H.sr,H.sg,H.sb,K),!!p.loop,!!p.dither);
 for(let j=0;j<m;j++){enc.add(getFrame(map(j),w,h));prog((j+1)/m);await maybeYield()}
 return enc.finish()}

let SS=null;
async function stream(msg){
 if(msg.type==='sinit'){SS={w:msg.w,h:msg.h,cs:msg.cs,loop:msg.loop,H:newHist(),stride:strideFor(msg.ns,msg.w,msg.h),enc:null};return}
 if(msg.type==='ssample'){accum(SS.H,new Uint8Array(msg.buf),SS.w,SS.h,SS.stride);return}
 if(msg.type==='sbuild'){const H=SS.H;SS.enc=makeEncoder(SS.w,SS.h,SS.cs,buildPalette(H.cnt,H.sr,H.sg,H.sb,255),SS.loop,false);SS.H=null;return}
 if(msg.type==='sframe'){SS.enc.add(new Uint8Array(msg.buf));await maybeYield();return}
 if(msg.type==='sfinish'){const r=SS.enc.finish();SS=null;return r}}

async function handle(msg,post){
 if(msg.type==='ping')post({type:'pong'});
 else if(msg.type==='init'){F=msg.frames.map(b=>new Uint8Array(b));BW=msg.w;BH=msg.h;BCS=msg.cs;N=F.length;post({type:'ready'})}
 else if(msg.type==='free'){F=null}
 else if(msg.type==='cancel')cancelled=true;
 else if(/^s(init|sample|build|frame|finish)$/.test(msg.type)){
  try{cancelled=false;const r=await stream(msg);post(r?{type:'ack',id:msg.id,r}:{type:'ack',id:msg.id},r?[r.bytes.buffer]:[])}
  catch(e){post({type:'err',id:msg.id,message:String(e&&e.message||e)})}}
 else if(msg.type==='encode'){
  try{const r=await encode(msg.p,f=>post({type:'prog',id:msg.id,f}));post({type:'done',id:msg.id,r},[r.bytes.buffer])}
  catch(e){post({type:'err',id:msg.id,message:String(e&&e.message||e)})}}}
return{handle}})();
</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const LAD={fps:[2,3,4,5,6,7,8,10,12,15,20],colors:[256,224,192,160,128,96,80,64,48,40,32,24,16],size:[1,.92,.85,.78,.72,.66,.6,.55,.5,.45,.4,.35,.3,.25]};
const CFG={fps:{max:2,min:6},colors:{max:256,min:16},size:{max:0,min:160}};
const fpsLadder=top=>{const hi=Math.max(top,CFG.fps.max);const l=LAD.fps.filter(c=>c>=hi&&c<=CFG.fps.min);return l.length?l:[hi]};
const NAMES={fps:'Smoothness (FPS)',colors:'Color accuracy',size:'Dimensions (pixels)'};
const OPTS={
  fps:{max:LAD.fps,min:LAD.fps,fmt:c=>Math.round(100/c)+' fps'},
  colors:{max:LAD.colors,min:LAD.colors,fmt:n=>n+' colors'},
  size:{max:[0,1920,1280,960,720,640,480],min:[480,360,320,240,160,120,80],fmt:p=>p?p+' px':'Original'}};
// higher q = better quality; used to keep min <= max
const Q={fps:c=>-c,colors:n=>n,size:p=>p||1e9};
const S={items:[],order:['fps','size','colors'],unit:'MB',busy:false,cancel:false,results:[]};
const vid=$('#vid');
const fmtB=b=>b>=1048576?(b/1048576).toFixed(b>=10485760?1:2)+' MB':Math.round(b/1024)+' KB';
const fmtFps=cs=>{const f=100/cs;return(f%1<.05||f%1>.95?Math.round(f):f.toFixed(1))+' fps'};
const topCsFor=fps=>LAD.fps.find(cs=>100/cs<=fps*1.12)||LAD.fps[LAD.fps.length-1];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- engine (worker with main-thread fallback) ---------- */
const encSrc=$('#enc-src').textContent;
let eng=null,engCb=()=>{};
async function getEngine(){
  if(eng)return eng;
  try{
    const blob=new Blob([encSrc+'\nself.onmessage=e=>API.handle(e.data,(m,t)=>self.postMessage(m,t||[]));'],{type:'text/javascript'});
    const url=URL.createObjectURL(blob),w=new Worker(url);
    const ok=await new Promise(res=>{const to=setTimeout(()=>res(false),2000);w.onmessage=e=>{if(e.data.type==='pong'){clearTimeout(to);res(true)}};w.onerror=()=>{clearTimeout(to);res(false)};w.postMessage({type:'ping'})});
    if(ok){w.onmessage=e=>engCb(e.data);w.onerror=null;eng={send:(m,t)=>w.postMessage(m,t||[])};return eng}
    w.terminate();
  }catch(e){}
  const API=new Function(encSrc+'\nreturn API;')();
  eng={send:(m)=>{API.handle(m,r=>setTimeout(()=>engCb(r),0))}};
  return eng;
}
let reqId=0;
function encodeOnce(p,onProg){
  return new Promise((res,rej)=>{
    const id=++reqId;
    engCb=m=>{
      if(m.id!==id)return;
      if(m.type==='prog')onProg(m.f);
      else if(m.type==='done')res(m.r);
      else if(m.type==='err')rej(new Error(m.message));
    };
    eng.send({type:'encode',id,p});
  });
}

function rpc(msg,tr){
  return new Promise((res,rej)=>{
    const id=++reqId;
    engCb=m=>{if(m.id!==id)return;if(m.type==='ack')res(m.r);else if(m.type==='err')rej(new Error(m.message))};
    eng.send({...msg,id},tr||[]);
  });
}

/* ---------- settings UI ---------- */
function setErr(t){const e=$('#err');e.textContent=t||'';e.style.display=t?'block':'none'}
function renderChips(){
  const c=$('#chips');c.innerHTML='';
  const lb=document.createElement('button');lb.type='button';lb.className='chip';lb.id='limitless';lb.textContent='Limitless';
  lb.onclick=()=>{$('#sz').value='';syncOrder()};
  [['500 KB',500,'KB'],['1 MB',1,'MB'],['2 MB',2,'MB'],['5 MB',5,'MB'],['10 MB',10,'MB'],['25 MB',25,'MB']].forEach(([t,v,u])=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;
    b.onclick=()=>{$('#sz').value=v;setUnit(u);syncOrder()};c.appendChild(b)});
  c.appendChild(lb);
}
function setUnit(u){S.unit=u;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.u===u))}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setUnit(b.dataset.u));
const arrow=d=>'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="'+(d?'M3 5.5 7 9.5l4-4':'M3 8.5 7 4.5l4 4')+'"/></svg>';
function renderOrder(){
  const ol=$('#order');ol.innerHTML='';
  S.order.forEach((k,i)=>{
    const li=document.createElement('li');
    const sel=w=>'<label>'+(w==='max'?'Max':'Min')+'<select data-k="'+k+'" data-w="'+w+'">'+OPTS[k][w].map(v=>'<option value="'+v+'"'+(v==CFG[k][w]?' selected':'')+'>'+OPTS[k].fmt(v)+'</option>').join('')+'</select></label>';
    li.innerHTML='<span class="n">'+(i+1)+'</span><div class="t"><b>'+NAMES[k]+'</b><div class="rg">'+sel('min')+sel('max')+'</div></div><div class="mv"><button type="button" aria-label="Move up" data-edge="'+(i===0?1:0)+'">'+arrow(0)+'</button><button type="button" aria-label="Move down" data-edge="'+(i===2?1:0)+'">'+arrow(1)+'</button></div>';
    const [u,d]=li.querySelectorAll('button');
    u.onclick=()=>{[S.order[i-1],S.order[i]]=[S.order[i],S.order[i-1]];renderOrder()};
    d.onclick=()=>{[S.order[i+1],S.order[i]]=[S.order[i],S.order[i+1]];renderOrder()};
    li.querySelectorAll('select').forEach(s=>s.onchange=()=>{
      const w=s.dataset.w,v=+s.value;CFG[k][w]=v;
      const o=w==='max'?'min':'max';
      if(w==='max'&&Q[k](CFG[k].max)<Q[k](CFG[k].min))CFG[k].min=v;
      if(w==='min'&&Q[k](CFG[k].min)>Q[k](CFG[k].max))CFG[k].max=v;
      renderOrder()});
    ol.appendChild(li);
  });
  syncOrder();
}
function syncOrder(){
  const on=parseFloat($('#sz').value)>0,sec=$('#order').parentElement;
  $('#limitless').setAttribute('aria-pressed',!on);
  sec.style.display=on?'block':'none';
  sec.querySelectorAll('button,select').forEach(e=>e.disabled=!on||e.dataset.edge==='1');
}
$('#sz').addEventListener('input',syncOrder);

/* ---------- file queue ---------- */
const drop=$('#drop');
drop.addEventListener('dragenter',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
$('#file').onchange=e=>{if(e.target.files.length)addFiles(e.target.files);e.target.value=''};
$('#more').onclick=()=>$('#file').click();

function renderList(){
  const has=S.items.length>0;
  $('#drop').style.display=has?'none':'block';$('#listwrap').style.display=has?'block':'none';
  const l=$('#list');l.innerHTML='';
  S.items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item';
    const m=it.meta;
    d.innerHTML='<div class="im"><b>'+esc(it.file.name)+'</b><small>'+(m?m.w+'\u00d7'+m.h+' \u00b7 '+m.dur.toFixed(1)+' s'+(m.fps?' \u00b7 '+Math.round(m.fps)+' fps':''):'')+'</small></div><span class="st'+(it.working?' w':'')+(it.bad?' f':'')+'">'+esc(it.status||'')+'</span><button class="x" type="button" aria-label="Remove" '+(S.busy?'disabled':'')+'>\u00d7</button>';
    d.querySelector('.x').onclick=()=>{URL.revokeObjectURL(it.url);S.items.splice(S.items.indexOf(it),1);renderList();sync()};
    l.appendChild(d);
  });
  sync();
}
function sync(){
  const n=S.items.filter(i=>i.meta&&!i.bad).length;
  $('#go').disabled=n===0;$('#go').textContent=n>1?'Create '+n+' GIFs':'Create GIF';
  $('#ctl').classList.toggle('dim',S.items.length===0);
  renderOrder();
}
function estimateFps(v){
  return new Promise(res=>{
    if(!('requestVideoFrameCallback' in v))return res(null);
    const t=[];let done=false;
    const fin=()=>{if(done)return;done=true;try{v.pause()}catch(e){}
      if(t.length<4)return res(null);
      const d=[];for(let i=1;i<t.length;i++){const x=t[i]-t[i-1];if(x>.001)d.push(x)}
      d.sort((a,b)=>a-b);res(d.length?1/d[d.length>>2]:null)};
    const cb=(n,md)=>{t.push(md.mediaTime);if(t.length>=14)fin();else v.requestVideoFrameCallback(cb)};
    v.muted=true;v.currentTime=0;
    const pr=v.play();
    if(pr&&pr.then)pr.then(()=>v.requestVideoFrameCallback(cb)).catch(()=>res(null));else v.requestVideoFrameCallback(cb);
    setTimeout(fin,1500);
  });
}
let probeChain=Promise.resolve();
function addFiles(list){
  setErr('');
  const files=[...list].filter(f=>/^video\//.test(f.type)||/\.(mp4|m4v|mov|webm)$/i.test(f.name));
  if(!files.length){setErr('Those don\u2019t look like video files.');return}
  files.forEach(f=>{
    const it={file:f,url:URL.createObjectURL(f),meta:null,status:'Reading\u2026',name:f.name.replace(/\.[^.]+$/,'')||'video'};
    S.items.push(it);
    probeChain=probeChain.then(()=>probe(it));
  });
  renderList();
}
async function probe(it){
  if(!S.items.includes(it))return;
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=it.url;
  const ok=await new Promise(res=>{const to=setTimeout(()=>res(false),8000);v.onloadeddata=()=>{clearTimeout(to);res(true)};v.onerror=()=>{clearTimeout(to);res(false)}});
  if(!ok||!v.videoWidth){it.bad=true;it.status='Unsupported';renderList();return}
  it.meta={w:v.videoWidth,h:v.videoHeight,dur:v.duration,fps:null};
  it.status='Ready';renderList();
  it.fpsP=estimateFps(v).then(x=>{it.meta.fps=x;renderList();v.removeAttribute('src');v.load();return x});
}

/* ---------- extraction ---------- */
function seek(v,t){return new Promise(res=>{
  if(Math.abs(v.currentTime-t)<.0005&&v.readyState>=2)return res();
  const to=setTimeout(done,3000);function done(){clearTimeout(to);v.removeEventListener('seeked',done);res()}
  v.addEventListener('seeked',done);v.currentTime=t})}
function makeGrabber(w,h,t0,t1,step){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
  return async k=>{
    if(S.cancel)throw new Error('cancelled');
    await seek(vid,Math.min(t0+k*step,Math.max(t0,t1-.002)));
    x.drawImage(vid,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data,rgb=new Uint8Array(w*h*3);
    for(let i=0,j=0;i<d.length;i+=4,j+=3){rgb[j]=d[i];rgb[j+1]=d[i+1];rgb[j+2]=d[i+2]}
    return rgb;
  };
}
async function extract(t0,t1,cs,n,w,h,onP){
  const grab=makeGrabber(w,h,t0,t1,cs/100),out=[];
  for(let k=0;k<n;k++){out.push(await grab(k));onP((k+1)/n)}
  return out;
}
// No size limit: stream frame by frame at the original size and the source frame rate; nothing is held in memory.
async function convertStream(it,P){
  const m=it.meta,t0=0,t1=m.dur,dur=t1-t0;
  const fps=(it.fpsP&&await it.fpsP)||60;
  const cs=Math.max(topCsFor(fps),CFG.fps.max);
  const w=Math.max(2,Math.min(m.w,CFG.size.max||1e9)),h=Math.max(2,Math.round(m.h*w/m.w));
  const n=Math.max(1,Math.ceil(dur*100/cs-1e-6)),ns=Math.min(n,40);
  const grab=makeGrabber(w,h,t0,t1,cs/100);
  const e=await getEngine();
  await rpc({type:'sinit',w,h,cs,loop:true,ns});
  for(let s=0;s<ns;s++){
    const k=ns===1?0:Math.round(s*(n-1)/(ns-1)),rgb=await grab(k);
    await rpc({type:'ssample',buf:rgb.buffer},[rgb.buffer]);
    P(.1*(s+1)/ns,'Preparing colors')}
  await rpc({type:'sbuild'});
  let pending=Promise.resolve();
  for(let k=0;k<n;k++){
    const rgb=await grab(k);
    await pending;
    pending=rpc({type:'sframe',buf:rgb.buffer},[rgb.buffer]);
    P(.1+.88*(k+1)/n,'Encoding '+Math.round((k+1)/n*100)+'%')}
  await pending;
  const r=await rpc({type:'sfinish'});
  return{r,fits:true};
}

/* ---------- convert ---------- */
function ui(mode){
  $('#go').style.display=mode==='work'?'none':'block';
  $('#prog').style.display=mode==='work'?'block':'none';
  $('#ctl').querySelectorAll('section:not(:last-child)').forEach(s=>s.classList.toggle('dim',mode==='work'));
}
function prog(f,txt){$('#pb').style.width=Math.round(f*100)+'%';if(txt!==undefined)$('#ps').innerHTML=txt}
$('#cancel').onclick=()=>{S.cancel=true;if(eng)eng.send({type:'cancel'})};
$('#go').onclick=run;

async function convert(it,idx,total,limit){
  const tag=total>1?'<b>'+(idx+1)+'/'+total+'</b> \u00b7 ':'';
  const P=(f,txt)=>prog((idx+f)/total,tag+txt);
  vid.src=it.url;
  await new Promise(res=>{const to=setTimeout(res,8000);vid.onloadeddata=()=>{clearTimeout(to);res()}});
  if(!isFinite(limit))return convertStream(it,P);
  const m=it.meta,t0=0,t1=m.dur,dur=t1-t0;
  const fps=(it.fpsP&&await it.fpsP)||30;
  const topCs=topCsFor(fps),maxW=Math.min(m.w,CFG.size.max||1e9),minW=Math.min(maxW,480);
  let cs=topCs,n=1,bw=m.w;
  for(const c of fpsLadder(topCs)){
    cs=c;n=Math.max(1,Math.ceil(dur*100/c-1e-6));
    const s=Math.min(1,maxW/m.w,Math.sqrt(420e6/(n*m.w*m.h*3)));
    bw=Math.max(2,Math.round(m.w*s));if(bw>=minW)break}
  const bh=Math.max(2,Math.round(m.h*bw/m.w));
  const frames=await extract(t0,t1,cs,n,bw,bh,f=>P(f*.4,'Reading frames '+Math.round(f*100)+'%'));
  const e=await getEngine();
  await new Promise(r=>{engCb=x=>{if(x.type==='ready')r()};e.send({type:'init',frames:frames.map(a=>a.buffer),w:bw,h:bh,cs},frames.map(a=>a.buffer))});
  const colorsL=LAD.colors.filter(n=>n<=CFG.colors.max&&n>=CFG.colors.min);
  let sizeL=LAD.size.filter(f=>bw*f>=CFG.size.min);
  if(!sizeL.length)sizeL=[1];
  if(CFG.size.min<bw&&bw*sizeL[sizeL.length-1]>CFG.size.min*1.05)sizeL.push(CFG.size.min/bw);
  const lv={fps:fpsLadder(cs).filter(c=>c>=cs),colors:colorsL.length?colorsL:[CFG.colors.max],size:sizeL};
  // Balanced path: always take the cheapest perceptual sacrifice next; priority scales how readily each gives way.
  const cost={
    fps:i=>{const f=100/lv.fps[i];return Math.max(0,33.3-f)/33.3+Math.max(0,20-f)*.08},
    colors:i=>Math.log2(256/lv.colors[i])*.12,
    size:i=>(1-lv.size[i])*1.2};
  const mult={};S.order.forEach((k,i)=>mult[k]=[1.6,1,.6][i]);
  const cur={fps:0,colors:0,size:0},states=[{...cur}];
  for(;;){
    let bk=null,bc=1e9;
    for(const k of ['fps','colors','size']){
      if(cur[k]>=lv[k].length-1)continue;
      const c=(cost[k](cur[k]+1)-cost[k](cur[k]))*mult[k];
      if(c<bc){bc=c;bk=k}}
    if(!bk)break;
    cur[bk]++;states.push({...cur})}
  const toP=s=>({cs:lv.fps[s.fps],colors:lv.colors[s.colors],scale:lv.size[s.size],dither:false,loop:true});
  const lim=isFinite(limit),expected=lim?2+Math.ceil(Math.log2(states.length)):1;
  const label=lim?'Fitting to '+fmtB(limit):'Encoding';
  let pass=0;const cache=new Map();
  const test=async i=>{
    if(cache.has(i))return cache.get(i);
    const base=.4+.6*Math.min(1,pass/expected);pass++;
    const r=await encodeOnce(toP(states[i]),f=>P(base+.6*f/expected,label+' \u00b7 try '+pass));
    r.i=i;cache.set(i,r);return r};
  let best,fits=true;
  const first=await test(0);
  if(first.bytes.length<=limit)best=first;
  else{
    const last=await test(states.length-1);
    if(last.bytes.length>limit){best=last;fits=false}
    else{let lo=0,hi=states.length-1;
      while(hi-lo>1){const mid=(lo+hi)>>1,r=await test(mid);if(r.bytes.length<=limit)hi=mid;else lo=mid}
      best=cache.get(hi)}}
  eng.send({type:'free'});
  return{r:best,fits};
}

async function run(){
  if(S.busy)return;S.busy=true;S.cancel=false;setErr('');
  const mult=S.unit==='MB'?1048576:1024,raw=parseFloat($('#sz').value),limit=raw>0?raw*mult:Infinity;
  const todo=S.items.filter(i=>i.meta&&!i.bad);
  S.results=[];$('#cards').innerHTML='';$('#res').style.display='none';$('#allrow').style.display='none';
  todo.forEach(i=>{i.status='Waiting';i.working=false});
  ui('work');renderList();prog(0,'');
  await getEngine();
  const used=new Set();
  for(let n=0;n<todo.length&&!S.cancel;n++){
    const it=todo[n];it.status='Working';it.working=true;renderList();
    try{
      const {r,fits}=await convert(it,n,todo.length,limit);
      let nm=it.name,k=1;while(used.has(nm.toLowerCase()))nm=it.name+'-'+(++k);used.add(nm.toLowerCase());
      const res={name:nm+'.gif',bytes:r.bytes,blob:new Blob([r.bytes],{type:'image/gif'})};
      S.results.push(res);addCard(res,r,limit,fits,todo.length>1);
      it.status=fmtB(r.bytes.length);it.working=false;
    }catch(err){
      it.working=false;
      if(String(err.message).includes('cancelled')){it.status='Cancelled';break}
      it.status='Failed';it.bad=false;
    }
  }
  todo.forEach(i=>{if(i.status==='Waiting')i.status='Ready'});
  S.busy=false;ui('idle');renderList();prog(1,'');
  if(S.results.length){
    $('#allrow').style.display=S.results.length>1?'block':'none';
    $('#res').style.display='block';
    setTimeout(()=>$('#res').scrollIntoView({behavior:'smooth',block:'start'}),50);
  }
}

function addCard(res,r,limit,fits,named){
  const url=URL.createObjectURL(res.blob),sz=r.bytes.length,lim=isFinite(limit);
  const c=document.createElement('div');c.className='card';
  const items=[['Dimensions',r.w+'\u00d7'+r.h],['Frame rate',fmtFps(r.cs)],['Colors',r.colors>=255?'256':r.colors],['Frames',r.frames]];
  c.innerHTML=(named?'<p class="cardName">'+esc(res.name)+'</p>':'')+
   '<div class="pv"><img alt=""></div>'+
   '<div class="big"><b>'+fmtB(sz)+'</b><span>'+(lim?'of '+fmtB(limit):'')+'</span></div>'+
   (lim?'<div class="fit'+(sz>limit?' over':'')+'"><i style="width:'+Math.min(100,sz/limit*100)+'%"></i></div>':'')+
   (fits?'':'<div class="warn" style="display:block">Even at the lowest settings this is '+fmtB(sz)+'.</div>')+
   '<div class="facts">'+items.map(([a,b])=>'<div><small>'+a+'</small><b>'+b+'</b></div>').join('')+'</div>'+
   '<button class="go" type="button">Download GIF</button>';
  c.querySelector('img').src=url;
  c.querySelector('button').onclick=()=>save(res.name,res.blob);
  $('#cards').appendChild(c);
}

/* ---------- download ---------- */
let dlP=null;
try{dlP=(window.claude&&claude.use)?claude.use('downloads').catch(()=>null):null}catch(e){dlP=null}
async function save(name,blob){
  try{const dl=dlP&&await dlP;
    if(dl){try{await dl.save({filename:name,data:blob});return}catch(e){if(e&&e.code==='declined')return}}}catch(e){}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=d=>{let c=~0;for(let i=0;i<d.length;i++)c=CRC[(c^d[i])&255]^(c>>>8);return(~c)>>>0};
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.bytes),sz=f.bytes.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nm,f.bytes);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    central.push(ch.buffer,nm);
    off+=30+nm.length+sz;
  }
  let cs=0;for(let i=0;i<central.length;i++)cs+=central[i].byteLength;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,end.buffer],{type:'application/zip'});
}
$('#dlall').onclick=()=>{if(S.results.length)save('gifs.zip',makeZip(S.results))};

renderChips();renderOrder();syncOrder();
})();
</script>
